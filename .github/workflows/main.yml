name: GCC 4.9 Docker image

on:
  push:
    branches: [ master ]
    paths:
      - docker/gcc-4.9/**
      - .github/workflows/gcc49-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: docker/gcc-4.9
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gcc-4.9-gnustep:latest
